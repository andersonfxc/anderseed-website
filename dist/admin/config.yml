backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "site_settings"
    label: "Site Settings"
    files:
      - label: "Global settings"
        name: "settings"
        file: "content/settings.json"
        format: "json"
        fields:
          - { label: "Site name", name: "siteName", widget: "string" }
          - { label: "Site URL", name: "siteUrl", widget: "string" }
          - { label: "Default description", name: "defaultDescription", widget: "text" }
          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Phone display", name: "phone", widget: "string" }
              - { label: "Phone link", name: "phoneHref", widget: "string" }
              - { label: "WhatsApp label", name: "whatsappLabel", widget: "string" }
              - { label: "WhatsApp URL", name: "whatsappUrl", widget: "string" }
          - label: "Social links"
            name: "social"
            widget: "object"
            fields:
              - { label: "Telegram", name: "telegram", widget: "string" }
              - { label: "Instagram", name: "instagram", widget: "string" }
              - { label: "TikTok", name: "tiktok", widget: "string" }
              - { label: "YouTube", name: "youtube", widget: "string" }
          - label: "Form and checkout links"
            name: "forms"
            widget: "object"
            fields:
              - { label: "Roadmap form endpoint", name: "roadmapEndpoint", widget: "string" }
              - { label: "Application form endpoint", name: "applicationEndpoint", widget: "string" }
              - { label: "Stripe checkout URL", name: "stripeCheckoutUrl", widget: "string" }
              - { label: "Klarna checkout URL", name: "klarnaCheckoutUrl", widget: "string" }
          - label: "Bank transfer details"
            name: "bank"
            widget: "object"
            fields:
              - { label: "Payee name", name: "payeeName", widget: "string" }
              - { label: "Bank name", name: "bankName", widget: "string" }
              - { label: "Sort code", name: "sortCode", widget: "string" }
              - { label: "Account number", name: "accountNumber", widget: "string" }
              - { label: "Payment reference", name: "reference", widget: "string" }
          - { label: "Footer tagline", name: "footerTagline", widget: "string" }

  - name: "page_content"
    label: "Page Content"
    files:
      - label: "Homepage"
        name: "homepage"
        file: "content/pages/homepage.json"
        format: "json"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow text", name: "eyebrowText", widget: "string" }
              - { label: "Eyebrow highlight", name: "eyebrowHighlight", widget: "string" }
              - { label: "Journey button label", name: "journeyButtonLabel", widget: "string" }
              - { label: "Headline prefix", name: "headlinePrefix", widget: "string" }
              - { label: "Headline highlight", name: "headlineHighlight", widget: "string" }
              - { label: "Subline", name: "subline", widget: "string" }
              - { label: "Body", name: "body", widget: "text" }
              - { label: "Primary button label", name: "primaryButtonLabel", widget: "string" }
              - { label: "Primary button URL", name: "primaryButtonUrl", widget: "string" }
              - { label: "Secondary button label", name: "secondaryButtonLabel", widget: "string" }
              - { label: "Secondary button URL", name: "secondaryButtonUrl", widget: "string" }
              - { label: "Community button label", name: "communityButtonLabel", widget: "string" }
          - label: "Programme"
            name: "programme"
            widget: "object"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
              - { label: "Featured title", name: "featuredTitle", widget: "string" }
              - { label: "Featured badge", name: "featuredBadge", widget: "string" }
              - { label: "Featured text", name: "featuredText", widget: "text" }
          - label: "Programme cards"
            name: "serviceCards"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Icon type", name: "type", widget: "select", options: ["cv", "guide", "counselling", "interview", "linkedin", "community"] }
              - { label: "Wide card", name: "wide", widget: "boolean", required: false, default: false }
          - label: "Portfolio artefacts"
            name: "artefacts"
            widget: "object"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Headline highlight", name: "headlineHighlight", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
              - { label: "Case selector label", name: "caseLabel", widget: "string" }
              - { label: "Journey banner", name: "journeyLabel", widget: "string" }
              - { label: "Trust line", name: "trustText", widget: "string" }
              - label: "Proof steps"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Stage label", name: "stage", widget: "string", required: false }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "text", widget: "text" }
                  - { label: "Icon type", name: "type", widget: "select", options: ["stakeholder", "process", "stories", "prototype", "requirements"] }
                  - { label: "Output tags", name: "tags", widget: "list", required: false, field: { label: "Tag", name: "tag", widget: "string" } }
              - label: "Business case choices"
                name: "project"
                widget: "object"
                fields:
                  - label: "System examples"
                    name: "systems"
                    widget: "list"
                    fields:
                      - { label: "Label", name: "label", widget: "string" }
                      - { label: "Number", name: "number", widget: "string", required: false }
                      - { label: "Title", name: "title", widget: "string" }
                      - { label: "Text", name: "text", widget: "string" }
                      - { label: "System type", name: "type", widget: "select", options: ["crm", "hcm", "erp"] }
              - label: "Outcome strip"
                name: "outcome"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Benefits", name: "benefits", widget: "list", field: { label: "Benefit", name: "benefit", widget: "string" } }
              - { label: "Footer text", name: "footerText", widget: "string" }
              - { label: "Footer highlight", name: "footerHighlight", widget: "string" }
          - label: "Process"
            name: "process"
            widget: "object"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
              - label: "Steps"
                name: "steps"
                widget: "list"
                fields:
                  - { label: "Marker", name: "marker", widget: "string" }
                  - { label: "Timeline", name: "time", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "text", widget: "text" }
                  - { label: "Style", name: "style", widget: "select", options: ["start", "training", "action", "confidence", "hired", "support"] }
          - label: "Salary"
            name: "salary"
            widget: "object"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
              - { label: "Permanent label", name: "permanentLabel", widget: "string" }
              - { label: "Permanent range", name: "permanentRange", widget: "string" }
              - { label: "Permanent note", name: "permanentNote", widget: "string" }
              - { label: "Contract label", name: "contractLabel", widget: "string" }
              - { label: "Contract range", name: "contractRange", widget: "string" }
              - { label: "Contract note", name: "contractNote", widget: "string" }
              - { label: "Student label", name: "studentLabel", widget: "string" }
              - { label: "Student range", name: "studentRange", widget: "string" }
          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
              - { label: "Social title", name: "socialTitle", widget: "string" }
              - { label: "Social intro", name: "socialIntro", widget: "text" }
          - label: "Community CTA"
            name: "community"
            widget: "object"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
              - { label: "Primary button label", name: "primaryButtonLabel", widget: "string" }
              - { label: "Secondary button label", name: "secondaryButtonLabel", widget: "string" }
              - { label: "Roadmap button label", name: "roadmapButtonLabel", widget: "string" }
      - label: "Pricing"
        name: "pricing"
        file: "content/pages/pricing.json"
        format: "json"
        fields:
          - { label: "Section label", name: "sectionLabel", widget: "string" }
          - { label: "Section title", name: "sectionTitle", widget: "string" }
          - { label: "Section intro", name: "sectionIntro", widget: "text" }
          - { label: "Individual services title", name: "individualServicesTitle", widget: "string" }
          - label: "Services"
            name: "services"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Description", name: "description", widget: "string" }
              - { label: "Price", name: "price", widget: "string" }
          - label: "Bundle"
            name: "bundle"
            widget: "object"
            fields:
              - { label: "Badge", name: "badge", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Price", name: "price", widget: "string" }
              - { label: "Was price", name: "was", widget: "string" }
              - { label: "Save text", name: "save", widget: "string" }
              - { label: "Features", name: "features", widget: "list", field: { label: "Feature", name: "feature", widget: "string" } }
              - { label: "Button label", name: "buttonLabel", widget: "string" }
              - { label: "Button URL", name: "buttonUrl", widget: "string" }
              - { label: "Payment note", name: "paymentNote", widget: "text" }
      - label: "Testimonials"
        name: "testimonials"
        file: "content/pages/testimonials.json"
        format: "json"
        fields:
          - { label: "Show testimonials on homepage", name: "visible", widget: "boolean", default: false, required: false }
          - { label: "Label", name: "label", widget: "string" }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Intro", name: "intro", widget: "text" }
          - label: "Testimonials"
            name: "items"
            widget: "list"
            fields:
              - { label: "Quote", name: "quote", widget: "text" }
              - { label: "Name", name: "name", widget: "string" }
      - label: "FAQs"
        name: "faqs"
        file: "content/pages/faqs.json"
        format: "json"
        fields:
          - { label: "Homepage FAQ intro", name: "homepageIntro", widget: "text" }
          - { label: "Homepage questions", name: "homepageQuestions", widget: "list", field: { label: "Question", name: "question", widget: "string" } }
          - label: "FAQ categories"
            name: "categories"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
              - label: "Questions"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Question", name: "question", widget: "string" }
                  - { label: "Answer", name: "answer", widget: "text" }
      - label: "About page"
        name: "about"
        file: "content/pages/about.json"
        format: "json"
        fields:
          - { label: "SEO title", name: "seoTitle", widget: "string" }
          - { label: "SEO description", name: "seoDescription", widget: "text" }
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Headline", name: "headline", widget: "string" }
          - { label: "Intro", name: "intro", widget: "text" }
          - label: "Difference cards"
            name: "differenceCards"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
      - label: "Blog page"
        name: "blog_page"
        file: "content/pages/blog.json"
        format: "json"
        fields:
          - { label: "SEO title", name: "seoTitle", widget: "string" }
          - { label: "SEO description", name: "seoDescription", widget: "text" }
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Headline", name: "headline", widget: "string" }
          - { label: "Headline highlight", name: "headlineHighlight", widget: "string" }
          - { label: "Introduction", name: "intro", widget: "text" }
          - { label: "Primary button label", name: "primaryButtonLabel", widget: "string" }
          - { label: "Secondary button label", name: "secondaryButtonLabel", widget: "string" }
          - { label: "Latest articles label", name: "latestLabel", widget: "string" }
          - { label: "Latest articles title", name: "latestTitle", widget: "string" }
          - { label: "Latest articles introduction", name: "latestIntro", widget: "text" }
          - { label: "Topics title", name: "topicsTitle", widget: "string" }
          - { label: "Resource label", name: "resourceLabel", widget: "string" }
          - { label: "Resource title", name: "resourceTitle", widget: "string" }
          - { label: "Resource text", name: "resourceText", widget: "text" }
          - { label: "Resource button label", name: "resourceButtonLabel", widget: "string" }
          - { label: "Community title", name: "communityTitle", widget: "string" }
          - { label: "Community text", name: "communityText", widget: "text" }
          - { label: "Community button label", name: "communityButtonLabel", widget: "string" }
      - label: "Terms page"
        name: "terms"
        file: "content/pages/terms.json"
        format: "json"
        fields:
          - { label: "SEO title", name: "seoTitle", widget: "string" }
          - { label: "SEO description", name: "seoDescription", widget: "text" }
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Headline", name: "headline", widget: "string" }
          - { label: "Introduction", name: "intro", widget: "text" }
          - { label: "Last updated", name: "lastUpdated", widget: "string" }
          - { label: "Professional review notice", name: "reviewNotice", widget: "text" }
          - label: "Sections"
            name: "sections"
            widget: "list"
            fields:
              - { label: "Heading", name: "title", widget: "string" }
              - { label: "Paragraphs", name: "paragraphs", widget: "list", required: false, field: { label: "Paragraph", name: "paragraph", widget: "text" } }
              - { label: "Bullet points", name: "bullets", widget: "list", required: false, field: { label: "Bullet", name: "bullet", widget: "text" } }
              - label: "Links"
                name: "links"
                widget: "list"
                required: false
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "href", widget: "string" }
      - label: "Privacy page"
        name: "privacy"
        file: "content/pages/privacy.json"
        format: "json"
        fields:
          - { label: "SEO title", name: "seoTitle", widget: "string" }
          - { label: "SEO description", name: "seoDescription", widget: "text" }
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Headline", name: "headline", widget: "string" }
          - { label: "Introduction", name: "intro", widget: "text" }
          - { label: "Last updated", name: "lastUpdated", widget: "string" }
          - { label: "Professional review notice", name: "reviewNotice", widget: "text" }
          - label: "Sections"
            name: "sections"
            widget: "list"
            fields:
              - { label: "Heading", name: "title", widget: "string" }
              - { label: "Paragraphs", name: "paragraphs", widget: "list", required: false, field: { label: "Paragraph", name: "paragraph", widget: "text" } }
              - { label: "Bullet points", name: "bullets", widget: "list", required: false, field: { label: "Bullet", name: "bullet", widget: "text" } }
              - label: "Links"
                name: "links"
                widget: "list"
                required: false
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "href", widget: "string" }
      - label: "Homepage roadmap section"
        name: "roadmap"
        file: "content/pages/roadmap.json"
        format: "json"
        fields:
          - { label: "SEO title", name: "seoTitle", widget: "string" }
          - { label: "SEO description", name: "seoDescription", widget: "text" }
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Headline", name: "headline", widget: "string" }
          - { label: "Intro", name: "intro", widget: "text" }
          - { label: "Hero primary button label", name: "heroPrimaryButtonLabel", widget: "string" }
          - { label: "Hero secondary button label", name: "heroSecondaryButtonLabel", widget: "string" }
          - { label: "Homepage section label", name: "homeSectionLabel", widget: "string" }
          - { label: "Homepage title", name: "homeTitle", widget: "string" }
          - { label: "Homepage title highlight", name: "homeTitleHighlight", widget: "string" }
          - { label: "Homepage intro", name: "homeIntro", widget: "text" }
          - label: "Homepage roadmap cards"
            name: "homeCards"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - { label: "Homepage includes aria label", name: "homeIncludesLabel", widget: "string" }
          - label: "Homepage includes cards"
            name: "homeIncludes"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - { label: "Inside section label", name: "insideLabel", widget: "string" }
          - { label: "Inside title", name: "insideTitle", widget: "string" }
          - { label: "Inside text", name: "insideText", widget: "text" }
          - { label: "Points", name: "points", widget: "list", field: { label: "Point", name: "point", widget: "string" } }
          - { label: "Form label", name: "formLabel", widget: "string" }
          - { label: "Form title", name: "formTitle", widget: "string" }
          - { label: "Form intro", name: "formIntro", widget: "text" }
          - { label: "First name label", name: "firstNameLabel", widget: "string" }
          - { label: "First name placeholder", name: "firstNamePlaceholder", widget: "string" }
          - { label: "Email label", name: "emailLabel", widget: "string" }
          - { label: "Email placeholder", name: "emailPlaceholder", widget: "string" }
          - { label: "Stage dropdown label", name: "stageLabel", widget: "string" }
          - { label: "Stage dropdown placeholder", name: "stagePlaceholder", widget: "string" }
          - { label: "Stage dropdown options", name: "stageOptions", widget: "list", field: { label: "Option", name: "option", widget: "string" } }
          - { label: "Hidden lead source value", name: "leadSource", widget: "string" }
          - { label: "Consent text before links", name: "consentText", widget: "string" }
          - { label: "Terms link label", name: "termsLinkLabel", widget: "string" }
          - { label: "Privacy link label", name: "privacyLinkLabel", widget: "string" }
          - { label: "Submit button label", name: "submitButtonLabel", widget: "string" }
          - { label: "Required fields note", name: "requiredNote", widget: "string" }
          - { label: "Next steps label", name: "nextStepsLabel", widget: "string" }
          - { label: "Next steps title", name: "nextStepsTitle", widget: "string" }
          - { label: "Next steps intro", name: "nextStepsIntro", widget: "text" }
          - label: "Next step cards"
            name: "nextStepCards"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }

  - name: "blog"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    preview_path: "blog/{{slug}}/"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Meta description", name: "description", widget: "text" }
      - { label: "Category", name: "category", widget: "string" }
      - { label: "Publish date", name: "date", widget: "date" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "Body", name: "body", widget: "markdown" }
