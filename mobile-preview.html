<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anderseed Mobile Preview — 390 × 844</title>
  <style>
    :root {
      color-scheme: light;
      --pine: #0f2e22;
      --forest: #1f6b52;
      --paper: #fffdf8;
      --ink: #171918;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      padding: 28px 18px 42px;
      background:
        radial-gradient(circle at 18% 8%, rgba(126, 212, 160, .18), transparent 27rem),
        linear-gradient(145deg, var(--paper), #f6efe2);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .preview-heading {
      width: min(100%, 470px);
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .preview-heading strong {
      display: block;
      color: var(--pine);
      font-size: 15px;
      letter-spacing: .02em;
    }

    .preview-heading span {
      display: block;
      margin-top: 3px;
      color: #4f5857;
      font-size: 12px;
    }

    .size {
      flex: 0 0 auto;
      border: 1px solid rgba(31, 107, 82, .25);
      border-radius: 999px;
      padding: 7px 10px;
      background: rgba(255, 255, 255, .74);
      color: var(--forest);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .phone {
      width: 422px;
      max-width: 100%;
      margin: 0 auto;
      padding: 15px;
      border: 1px solid rgba(15, 46, 34, .28);
      border-radius: 38px;
      background: var(--pine);
      box-shadow: 0 28px 70px rgba(15, 46, 34, .22);
    }

    .screen {
      width: 390px;
      max-width: 100%;
      height: 844px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 25px;
      background: var(--paper);
    }

    iframe {
      display: block;
      width: 390px;
      max-width: 100%;
      height: 844px;
      border: 0;
      background: var(--paper);
    }

    @media (max-width: 460px) {
      body { padding: 16px 8px 28px; }
      .preview-heading { padding: 0 8px; }
      .phone { border-radius: 30px; padding: 9px; }
      .screen { border-radius: 22px; }
    }
  </style>
</head>
<body>
  <header class="preview-heading">
    <div>
      <strong>Anderseed mobile view</strong>
      <span>Live website — scroll and interact inside the phone</span>
    </div>
    <div class="size">390 × 844</div>
  </header>

  <main class="phone" aria-label="Anderseed website at mobile size">
    <div class="screen">
      <iframe src="./index.html" title="Anderseed Consulting mobile website"></iframe>
    </div>
  </main>
</body>
</html>
